<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F5FB">
<title>VocabLuxe</title>
<script>
/* Chọn giao diện sáng/tối trước khi vẽ để không bị chớp: ưu tiên lựa chọn đã lưu, nếu chưa có thì theo hệ thống */
(function () {
  var t = null;
  try { t = (JSON.parse(localStorage.getItem('vl_state') || '{}') || {}).theme; } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    var d = false;
    try { d = window.AndroidBridge && window.AndroidBridge.isSystemDark ? !!window.AndroidBridge.isSystemDark() : matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    t = d ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Bộ biểu tượng (nét liền, dùng chung) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.4-4.4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-checkc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.3 2.8 2.8L16.2 9.5"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.36 6.3 20.36l1.09-6.35-4.62-4.5 6.38-.93L12 2.8Z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.6 5.4a9.4 9.4 0 0 1 0 13.2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.9.9 0 0 0 1.38.76l10.6-6.8a.9.9 0 0 0 0-1.52L9.38 4.44A.9.9 0 0 0 8 5.2Z" stroke="none" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3.5h4.5V8M4 20.5 20.5 4M20.5 16v4.5H16M14.8 14.8l5.7 5.7M4 4l5 5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.6v.1"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.4 9.4a2.7 2.7 0 1 1 3.9 2.4c-.8.4-1.3 1-1.3 1.9M12 17v.1"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.6 3.9 5.8 3.9 9.5s-1.3 6.9-3.9 9.5c-2.6-2.6-3.9-5.8-3.9-9.5S9.4 5.1 12 2.5Z"/></symbol>
    <symbol id="i-snail" viewBox="0 0 24 24"><path d="M12 7.5V12l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="scrim"></div>

  <!-- Menu chủ đề -->
  <aside id="drawer" data-i18n-aria="topics">
    <div class="dhead">
      <div class="logo" aria-hidden="true">V</div>
      <div class="dbrand">
        <div class="brand">VocabLuxe</div>
        <div class="brand-sub" data-i18n="brandSub"></div>
      </div>
    </div>
    <div class="cap dcap" data-i18n="topics"></div>
    <div id="topics"></div>
    <div class="dfoot">
      <button id="btnGuide" class="legal-link"><svg class="ic sm"><use href="#i-help"/></svg><span data-i18n="guideBtn"></span></button>
      <button id="btnLang" class="legal-link"><svg class="ic sm"><use href="#i-globe"/></svg><span data-i18n="langBtn"></span></button>
      <button id="btnLegal" class="legal-link"><svg class="ic sm"><use href="#i-info"/></svg><span data-i18n="legalBtn"></span></button>
    </div>
  </aside>

  <!-- Danh sách từ -->
  <main id="listPane">
    <header class="lhead">
      <div class="topbar">
        <button id="btnMenu" class="icon-btn" data-i18n-aria="openTopics"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div class="titlebox">
          <div class="brand sm">VocabLuxe</div>
          <div id="stats" class="stats-text"></div>
        </div>
        <button id="btnTheme" class="icon-btn" >
          <svg class="ic ic-sun"><use href="#i-sun"/></svg><svg class="ic ic-moon"><use href="#i-moon"/></svg>
        </button>
      </div>
      <div class="bar"><i id="barFill"></i></div>

      <div id="langs" class="langs"></div>

      <div class="searchbox">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" data-i18n-ph="searchPh" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button id="btnClear" class="clear" hidden data-i18n-aria="clearSearch"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>

      <div id="seg" class="seg" role="tablist">
        <button data-v="all" class="on" data-i18n="fAll"></button>
        <button data-v="todo" data-i18n="fTodo"></button>
        <button data-v="done" data-i18n="fDone"></button>
        <button data-v="fav" data-i18n="fFav"></button>
      </div>

      <div class="titlerow">
        <div class="ttext"><div id="lTitle" class="ltitle"></div><div id="lCount" class="lcount"></div></div>
        <button id="btnLevel" class="tonal" aria-haspopup="dialog" data-i18n-aria="chooseLevel"><span id="levelText"></span><svg class="ic sm"><use href="#i-down"/></svg></button>
        <button id="btnPractice" class="tonal strong"><svg class="ic sm"><use href="#i-shuffle"/></svg><span data-i18n="practice"></span></button>
      </div>
    </header>
    <div id="list"><div id="rows"></div></div>
  </main>

  <!-- Chi tiết từ -->
  <section id="detail">
    <div class="dtop">
      <button id="btnBack" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="chips">
        <span id="chipTopic" class="chip primary"></span>
        <span id="chipLvl" class="chip"></span>
        <span id="chipPos" class="chip dim"></span>
      </div>
    </div>

    <div id="dscroll">
      <div class="hero">
        <div id="word" class="word"></div>
        <div id="phon" class="phon"></div>

        <div class="arow">
          <button id="btnPlay" class="play" data-i18n-aria="listen"><svg class="ic"><use href="#i-play"/></svg></button>
          <button id="btnSlow" class="tonal"><svg class="ic sm"><use href="#i-snail"/></svg><span data-i18n="slow"></span></button>
        </div>

        <div class="swrow">
          <label class="sw"><input type="checkbox" id="swAuto"><i></i><span data-i18n="autoPlay"></span></label>
          <label class="sw"><input type="checkbox" id="swReview"><i></i><span data-i18n="reviewMode"></span></label>
        </div>
      </div>
      <div class="hint" data-i18n="swipeHint"></div>

      <div class="panel">
        <div class="cap" data-i18n="meaning"></div>
        <div id="mean" class="mean"></div>
        <div id="more" class="more"></div>
        <div id="defEn" class="defen"></div>
        <button id="btnReveal" class="tonal strong"><svg class="ic sm"><use href="#i-eye"/></svg><span data-i18n="reveal"></span></button>
      </div>

      <div class="panel">
        <div class="cap" data-i18n="context"></div>
        <div class="exrow">
          <button id="btnExPlay" class="play sm" data-i18n-aria="listenEx"><svg class="ic"><use href="#i-vol"/></svg></button>
          <div class="extext">
            <div id="ex" class="ex"></div>
            <div id="exPhon" class="exphon"></div>
            <div id="exVi" class="exvi"></div>
          </div>
        </div>
      </div>
      <div class="source"><span data-i18n="srcPrefix"></span>: Oxford 3000/5000 · HSK 1–6</div>
    </div>

    <div class="nav">
      <button id="btnPrev" class="nbtn icon" data-i18n-aria="prev"><svg class="ic"><use href="#i-left"/></svg></button>
      <button id="btnLearn" class="nbtn wide"></button>
      <button id="btnFav" class="nbtn wide"></button>
      <button id="btnNext" class="nbtn icon" data-i18n-aria="next"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
  </section>


  <!-- Giấy phép sử dụng, nguồn dữ liệu, quảng cáo, quyền riêng tư (nội dung do app.js dựng theo ngôn ngữ) -->
  <section id="legal">
    <div class="dtop">
      <button id="btnLegalBack" class="icon-btn" data-i18n-aria="back"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="legal-title" data-i18n="legalTitle"></div>
    </div>
    <div id="legalScroll" class="legal-scroll"><div id="legalBody"></div><div class="source">VocabLuxe</div></div>
  </section>

  <!-- Hướng dẫn sử dụng (tự mở lần đầu, mở lại từ menu) -->
  <section id="guide" role="dialog" aria-modal="true">
    <div class="gtop"><button id="btnGuideSkip" class="gskip" data-i18n="guideSkip"></button></div>
    <div class="gbody">
      <div id="gicon" class="gicon"></div>
      <h2 id="gtitle" class="gtitle"></h2>
      <p id="gtext" class="gtext"></p>
    </div>
    <div id="gdots" class="gdots"></div>
    <div class="gnav">
      <button id="btnGuidePrev" class="tonal"><svg class="ic sm"><use href="#i-left"/></svg><span data-i18n="back"></span></button>
      <button id="btnGuideNext" class="tonal strong"><span id="gnextText"></span><svg class="ic sm"><use href="#i-right"/></svg></button>
    </div>
  </section>

  <!-- Bảng chọn cấp độ (thay cho dropdown mặc định) -->
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div id="sheetTitle" class="sheet-title"></div>
    <div id="sheetList" class="sheet-list"></div>
  </div>

  <div id="updateBar" role="status" hidden><span data-i18n="updDone"></span><button id="btnRestart" data-i18n="updRestart"></button></div>
  <div id="toast" role="status"></div>
</div>
<script src="i18n.js"></script>
<script src="i18n-guide.js"></script>
<script src="app.js"></script>
</body>
</html>
