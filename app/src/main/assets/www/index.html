<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F5FB">
<title>VocabLuxe</title>
<script>
/* Chọn giao diện sáng/tối trước khi vẽ để không bị chớp: ưu tiên lựa chọn đã lưu, nếu chưa có thì theo hệ thống */
(function () {
  var t = null;
  try { t = (JSON.parse(localStorage.getItem('vl_state') || '{}') || {}).theme; } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    var d = false;
    try { d = window.AndroidBridge && window.AndroidBridge.isSystemDark ? !!window.AndroidBridge.isSystemDark() : matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    t = d ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Bộ biểu tượng (nét liền, dùng chung) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.4-4.4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-checkc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.3 2.8 2.8L16.2 9.5"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.36 6.3 20.36l1.09-6.35-4.62-4.5 6.38-.93L12 2.8Z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.6 5.4a9.4 9.4 0 0 1 0 13.2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.9.9 0 0 0 1.38.76l10.6-6.8a.9.9 0 0 0 0-1.52L9.38 4.44A.9.9 0 0 0 8 5.2Z" stroke="none" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3.5h4.5V8M4 20.5 20.5 4M20.5 16v4.5H16M14.8 14.8l5.7 5.7M4 4l5 5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.6v.1"/></symbol>
    <symbol id="i-snail" viewBox="0 0 24 24"><path d="M12 7.5V12l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="scrim"></div>

  <!-- Menu chủ đề -->
  <aside id="drawer" aria-label="Chủ đề">
    <div class="dhead">
      <div class="logo" aria-hidden="true">V</div>
      <div class="dbrand">
        <div class="brand">VocabLuxe</div>
        <div class="brand-sub">Từ vựng Anh · Trung · Nhật · Hàn</div>
      </div>
    </div>
    <div class="cap dcap">Chủ đề</div>
    <div id="topics"></div>
    <button id="btnAbout" class="aboutbtn"><svg class="ic sm"><use href="#i-info"/></svg><span>Nguồn &amp; giấy phép</span></button>
  </aside>

  <!-- Danh sách từ -->
  <main id="listPane">
    <header class="lhead">
      <div class="topbar">
        <button id="btnMenu" class="icon-btn" aria-label="Mở danh sách chủ đề"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div class="titlebox">
          <div class="brand sm">VocabLuxe</div>
          <div id="stats" class="stats-text"></div>
        </div>
        <button id="btnTheme" class="icon-btn" aria-label="Đổi giao diện sáng / tối">
          <svg class="ic ic-sun"><use href="#i-sun"/></svg><svg class="ic ic-moon"><use href="#i-moon"/></svg>
        </button>
      </div>
      <div class="bar"><i id="barFill"></i></div>

      <div id="langs" class="langs"></div>

      <div class="searchbox">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Tìm từ, nghĩa, phiên âm…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button id="btnClear" class="clear" hidden aria-label="Xóa từ khóa"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>

      <div id="seg" class="seg" role="tablist">
        <button data-v="all" class="on">Tất cả</button>
        <button data-v="todo">Chưa thuộc</button>
        <button data-v="done">Đã thuộc</button>
        <button data-v="fav">Yêu thích</button>
      </div>

      <div class="titlerow">
        <div class="ttext"><div id="lTitle" class="ltitle"></div><div id="lCount" class="lcount"></div></div>
        <button id="btnLevel" class="tonal" aria-haspopup="dialog" aria-label="Chọn cấp độ"><span id="levelText">Mọi cấp</span><svg class="ic sm"><use href="#i-down"/></svg></button>
        <button id="btnPractice" class="tonal strong"><svg class="ic sm"><use href="#i-shuffle"/></svg><span>Luyện tập</span></button>
      </div>
    </header>
    <div id="list"><div id="rows"></div></div>
  </main>

  <!-- Chi tiết từ -->
  <section id="detail" aria-label="Chi tiết từ">
    <div class="dtop">
      <button id="btnBack" class="icon-btn" aria-label="Quay lại danh sách"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="chips">
        <span id="chipTopic" class="chip primary"></span>
        <span id="chipLvl" class="chip"></span>
        <span id="chipPos" class="chip dim"></span>
      </div>
    </div>

    <div id="dscroll">
      <div class="hero">
        <div id="word" class="word"></div>
        <div id="phon" class="phon"></div>

        <div class="arow">
          <button id="btnPlay" class="play" aria-label="Nghe phát âm"><svg class="ic"><use href="#i-play"/></svg></button>
          <button id="btnSlow" class="tonal"><svg class="ic sm"><use href="#i-snail"/></svg><span>Nghe chậm</span></button>
        </div>

        <div class="swrow">
          <label class="sw"><input type="checkbox" id="swAuto"><i></i><span>Tự phát âm</span></label>
          <label class="sw"><input type="checkbox" id="swReview"><i></i><span>Ôn tập (ẩn nghĩa)</span></label>
        </div>
      </div>
      <div class="hint">Vuốt trái / phải để chuyển từ</div>

      <div class="panel">
        <div class="cap">Nghĩa</div>
        <div id="mean" class="mean"></div>
        <div id="more" class="more"></div>
        <div id="defEn" class="defen"></div>
        <button id="btnReveal" class="tonal strong"><svg class="ic sm"><use href="#i-eye"/></svg><span>Hiện đáp án</span></button>
      </div>

      <div class="panel">
        <div class="cap">Ngữ cảnh</div>
        <div class="exrow">
          <button id="btnExPlay" class="play sm" aria-label="Nghe câu ví dụ"><svg class="ic"><use href="#i-vol"/></svg></button>
          <div class="extext">
            <div id="ex" class="ex"></div>
            <div id="exPhon" class="exphon"></div>
            <div id="exVi" class="exvi"></div>
          </div>
        </div>
      </div>
      <div id="source" class="source"></div>
    </div>

    <div class="nav">
      <button id="btnPrev" class="nbtn icon" aria-label="Từ trước"><svg class="ic"><use href="#i-left"/></svg></button>
      <button id="btnLearn" class="nbtn wide"></button>
      <button id="btnFav" class="nbtn wide"></button>
      <button id="btnNext" class="nbtn icon" aria-label="Từ tiếp theo"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
  </section>

  <!-- Bảng chọn cấp độ (thay cho dropdown mặc định) -->
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div id="sheetTitle" class="sheet-title">Chọn cấp độ</div>
    <div id="sheetList" class="sheet-list"></div>
  </div>

  <!-- Nguồn & giấy phép -->
  <section id="about" aria-label="Nguồn và giấy phép">
    <div class="dtop">
      <button id="btnAboutBack" class="icon-btn" aria-label="Quay lại"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="about-title">Nguồn &amp; giấy phép</div>
    </div>
    <div id="aboutBody"></div>
  </section>

  <div id="toast" role="status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
