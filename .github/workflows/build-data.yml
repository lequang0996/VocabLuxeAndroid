name: Build data

# Chạy thủ công: tải nguồn → dịch/gán chủ đề → ghi en/zh/ja/ko.json + sources.json → tự commit vào repo.
on:
  workflow_dispatch:
    inputs:
      translator:
        description: 'Bộ dịch nghĩa tiếng Việt: opus (offline, miễn phí) hoặc google (API chính thức, cần secret GOOGLE_TRANSLATE_API_KEY)'
        default: opus
        type: choice
        options: [opus, google]
      extra_args:
        description: 'Tham số thêm cho build_data.py (vd: --inspect-ko, --ko-include-ungraded, --langs en,zh,ja)'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Cài thư viện (torch bản CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/requirements.txt

      # Giữ bộ nhớ đệm bản dịch giữa các lần chạy để chạy lại nhanh
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: build-data-cache-${{ hashFiles('tools/build_data.py') }}
          restore-keys: build-data-cache-

      - name: Dựng dữ liệu
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python tools/build_data.py --translator "${{ inputs.translator }}" ${{ inputs.extra_args }}

      - name: Kiểm tra dữ liệu
        run: python tools/check_data.py

      - name: Commit dữ liệu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/data
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu."
          else
            git commit -m "Build data: dựng lại en/zh/ja/ko.json từ nguồn mở"
            git push
          fi
